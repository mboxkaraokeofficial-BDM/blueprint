<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Identity — me</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#080808;--surface:#111;--border:#1a1a1a;--text:#e5e5e5;--muted:#555;--accent:#a78bfa;--accent-dim:rgba(167,139,250,0.08)}body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}.wrap{max-width:720px;margin:0 auto;padding:48px 40px}.back{font-size:12px;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:40px}.back:hover{color:var(--accent)}.label{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}h1{font-size:28px;font-weight:500;margin-top:10px;letter-spacing:-.02em}h1 span{color:var(--accent)}.block{margin-top:36px}.block-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.block-title{font-size:11px;font-weight:500;color:var(--accent);letter-spacing:.1em;text-transform:uppercase}.edit-btn{font-size:11px;color:var(--muted);background:none;border:none;cursor:pointer;padding:2px 8px;border-radius:4px}.edit-btn:hover{color:var(--accent);background:var(--accent-dim)}.block-body{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px 24px;font-size:14px;line-height:1.9;color:#ccc;min-height:80px;outline:none;white-space:pre-wrap;word-break:break-word}.block-body[contenteditable=true]{border-color:var(--accent);background:var(--accent-dim)}.block-body.empty{color:var(--muted);font-style:italic}.saved-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;opacity:0;transition:opacity .3s}.saved-dot.show{opacity:1}@media(max-width:600px){.wrap{padding:32px 20px}}</style></head><body><div class="wrap"><a class="back" href="/">← back</a><div class="label">Core Module</div><h1><span>◈</span> Identity <span class="saved-dot" id="dot"></span></h1><div class="block"><div class="block-header"><div class="block-title">Who Am I</div><button class="edit-btn" onclick="toggleEdit('whoami')">edit</button></div><div class="block-body empty" id="whoami" data-placeholder="ฉันเป็นใคร..." onclick="startEdit('whoami')"></div></div><div class="block"><div class="block-header"><div class="block-title">Values</div><button class="edit-btn" onclick="toggleEdit('values')">edit</button></div><div class="block-body empty" id="values" data-placeholder="สิ่งที่ฉันให้ความสำคัญ..." onclick="startEdit('values')"></div></div><div class="block"><div class="block-header"><div class="block-title">Principles</div><button class="edit-btn" onclick="toggleEdit('principles')">edit</button></div><div class="block-body empty" id="principles" data-placeholder="หลักการที่ใช้ตัดสินใจ..." onclick="startEdit('principles')"></div></div><div class="block"><div class="block-header"><div class="block-title">How I Think</div><button class="edit-btn" onclick="toggleEdit('think')">edit</button></div><div class="block-body empty" id="think" data-placeholder="วิธีที่ฉันคิดและมองโลก..." onclick="startEdit('think')"></div></div></div><script>const FIELDS=['whoami','values','principles','think'],KEY='blueprint_identity';function flash(){const d=document.getElementById('dot');d.classList.add('show');setTimeout(()=>d.classList.remove('show'),1200)}function save(){const data={};FIELDS.forEach(id=>{const el=document.getElementById(id);if(!el.classList.contains('empty'))data[id]=el.textContent});localStorage.setItem(KEY,JSON.stringify(data));flash()}function startEdit(id){const el=document.getElementById(id);if(el.classList.contains('empty')){el.textContent='';el.classList.remove('empty')}el.contentEditable='true';el.focus()}function toggleEdit(id){const el=document.getElementById(id);if(el.contentEditable==='true'){el.contentEditable='false';if(!el.textContent.trim()){el.textContent=el.dataset.placeholder;el.classList.add('empty')}save()}else startEdit(id)}FIELDS.forEach(id=>{document.getElementById(id).addEventListener('blur',()=>{const el=document.getElementById(id);el.contentEditable='false';if(!el.textContent.trim()){el.textContent=el.dataset.placeholder;el.classList.add('empty')}save()})});(function load(){const saved=JSON.parse(localStorage.getItem(KEY)||'{}');FIELDS.forEach(id=>{const el=document.getElementById(id);if(saved[id]){el.textContent=saved[id];el.classList.remove('empty')}else{el.textContent=el.dataset.placeholder;el.classList.add('empty')}})})()</script></body></html>
