<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Now — me</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#080808;--surface:#111;--border:#1a1a1a;--text:#e5e5e5;--muted:#555;--accent:#a78bfa;--accent-dim:rgba(167,139,250,0.08)}body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}.wrap{max-width:720px;margin:0 auto;padding:48px 40px}.back{font-size:12px;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:40px}.back:hover{color:var(--accent)}.label{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}h1{font-size:28px;font-weight:500;margin-top:10px;letter-spacing:-.02em}h1 span{color:var(--accent)}.updated{font-size:12px;color:var(--muted);margin-top:8px}.block{margin-top:36px}.block-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.block-title{font-size:11px;font-weight:500;color:var(--accent);letter-spacing:.1em;text-transform:uppercase}.edit-btn{font-size:11px;color:var(--muted);background:none;border:none;cursor:pointer;padding:2px 8px;border-radius:4px}.edit-btn:hover{color:var(--accent);background:var(--accent-dim)}.block-body{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px 24px;font-size:14px;line-height:1.9;color:#ccc;min-height:70px;outline:none;white-space:pre-wrap;word-break:break-word}.block-body[contenteditable=true]{border-color:var(--accent);background:var(--accent-dim)}.block-body.empty{color:var(--muted);font-style:italic}.saved-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;opacity:0;transition:opacity .3s}.saved-dot.show{opacity:1}@media(max-width:600px){.wrap{padding:32px 20px}}</style></head><body><div class="wrap"><a class="back" href="/">← back</a><div class="label">Now Page</div><h1><span>◉</span> Now <span class="saved-dot" id="dot"></span></h1><div class="updated" id="upd"></div><div class="block"><div class="block-header"><div class="block-title">Focus</div><button class="edit-btn" onclick="toggleEdit('focus')">edit</button></div><div class="block-body empty" id="focus" data-placeholder="โฟกัสหลักตอนนี้..." onclick="startEdit('focus')"></div></div><div class="block"><div class="block-header"><div class="block-title">Building</div><button class="edit-btn" onclick="toggleEdit('building')">edit</button></div><div class="block-body empty" id="building" data-placeholder="กำลังสร้างอะไร..." onclick="startEdit('building')"></div></div><div class="block"><div class="block-header"><div class="block-title">Thinking About</div><button class="edit-btn" onclick="toggleEdit('thinking')">edit</button></div><div class="block-body empty" id="thinking" data-placeholder="กำลังคิดถึงอะไร..." onclick="startEdit('thinking')"></div></div><div class="block"><div class="block-header"><div class="block-title">Not Doing</div><button class="edit-btn" onclick="toggleEdit('notdoing')">edit</button></div><div class="block-body empty" id="notdoing" data-placeholder="สิ่งที่ตั้งใจไม่ทำตอนนี้..." onclick="startEdit('notdoing')"></div></div></div><script>const FIELDS=['focus','building','thinking','notdoing'],KEY='blueprint_now';let data=JSON.parse(localStorage.getItem(KEY)||'{}');function flash(){const d=document.getElementById('dot');d.classList.add('show');setTimeout(()=>d.classList.remove('show'),1200)}function save(){FIELDS.forEach(id=>{const el=document.getElementById(id);data[id]=el.classList.contains('empty')?'':el.textContent});data.updated=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(data));flash();renderUpd()}function renderUpd(){const el=document.getElementById('upd');el.textContent=data.updated?'Updated: '+new Date(data.updated).toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric'}):''}function startEdit(id){const el=document.getElementById(id);if(el.classList.contains('empty')){el.textContent='';el.classList.remove('empty')}el.contentEditable='true';el.focus()}function toggleEdit(id){const el=document.getElementById(id);if(el.contentEditable==='true'){el.contentEditable='false';if(!el.textContent.trim()){el.textContent=el.dataset.placeholder;el.classList.add('empty')}save()}else startEdit(id)}FIELDS.forEach(id=>{document.getElementById(id).addEventListener('blur',()=>{const el=document.getElementById(id);el.contentEditable='false';if(!el.textContent.trim()){el.textContent=el.dataset.placeholder;el.classList.add('empty')}save()})});(function load(){FIELDS.forEach(id=>{const el=document.getElementById(id);if(data[id]){el.textContent=data[id];el.classList.remove('empty')}else{el.textContent=el.dataset.placeholder;el.classList.add('empty')}});renderUpd()})()</script></body></html>
